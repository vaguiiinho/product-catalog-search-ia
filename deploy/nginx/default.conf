limit_req_zone $binary_remote_addr zone=assistant_rate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=products_rate:10m rate=20r/m;

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  location = /api/catalog/assistant/ask {
    limit_req zone=assistant_rate burst=2 nodelay;
    limit_req_status 429;
    error_page 429 = @assistant_rate_limited;
    proxy_pass http://api:3001/api/catalog/assistant/ask;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/auth/login {
    limit_req zone=login_rate burst=2 nodelay;
    limit_req_status 429;
    error_page 429 = @login_rate_limited;
    proxy_pass http://api:3001/api/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/products {
    limit_req zone=products_rate burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @products_rate_limited;
    proxy_pass http://api:3001/api/products;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server Actions valida a origem contra este cabecalho. Preserve a porta
    # publica (81 no ambiente Docker) em vez de enviar apenas "localhost".
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
  }

  location @assistant_rate_limited {
    default_type application/json;
    add_header Retry-After 12 always;
    return 429 '{"statusCode":429,"message":"Muitas perguntas em pouco tempo. Tente novamente em cerca de 12 segundos."}';
  }

  location @login_rate_limited {
    default_type application/json;
    add_header Retry-After 12 always;
    return 429 '{"statusCode":429,"message":"Muitas tentativas de acesso. Tente novamente em cerca de 12 segundos."}';
  }

  location @products_rate_limited {
    default_type application/json;
    add_header Retry-After 3 always;
    return 429 '{"statusCode":429,"message":"Muitas solicitações ao catálogo. Tente novamente em cerca de 3 segundos."}';
  }
}
